}

// ------------------------------------------------------------------ defaults & bindings
function schema(tplKey) {
  const tpl = TEMPLATES[tplKey];
  return [...(tpl ? tpl.settings : []), ...SHARED];
}
function defaults(tplKey) {
  const out = {};
  for (const sec of schema(tplKey)) for (const it of sec.items) out[it.key] = it.default;
  return out;
}

// guess sensible bindings for a template from the column types
function autoBind(tplKey, data, previous) {
  const tpl = TEMPLATES[tplKey];
  const headers = data[0] || [];
  const body = data.slice(1);
  const types = headers.map((_, i) => columnType(body.map(r => r[i])));
  const used = new Set();
  const out = {};
  const isNum = i => types[i] === "number";
  const isText = i => types[i] === "text";
  const isDate = i => types[i] === "date" || types[i] === "year";
  const firstFree = pred => headers.findIndex((_, i) => !used.has(i) && pred(i));
  for (const bd of tpl.bindings) {
    if (bd.optional) { out[bd.key] = bd.type === "columns" ? [] : null; continue; }
    if (bd.type === "columns") {
      let cols;
      if (bd.prefer === "text") cols = headers.map((_, i) => i).filter(i => !used.has(i) && (isText(i) || isDate(i)));
      else cols = headers.map((_, i) => i).filter(i => !used.has(i) && isNum(i) && !/^(rank|total|#|no\.?)$/i.test(str(headers[i])));
      if (tplKey === "line" || tplKey === "column" || tplKey === "bar") cols = cols.slice(0, 8);
      // never fill a number slot with text columns; an empty slot gives a clearer message
      if (cols.length < (bd.min || 1) && bd.prefer !== "number") cols = headers.map((_, i) => i).filter(i => !used.has(i)).slice(0, Math.max(bd.min || 1, cols.length));
      cols.forEach(i => used.add(i));
      out[bd.key] = cols;
    } else {
      let i = -1;
      if (bd.prefer === "date") i = firstFree(isDate);
      if (i < 0 && (bd.prefer === "text" || bd.prefer === "date" || bd.prefer === "any")) i = firstFree(i2 => isText(i2) || isDate(i2));
      if (i < 0 && bd.prefer === "number") i = firstFree(isNum);
      if (i < 0 && bd.prefer !== "number") i = firstFree(() => true);
      if (i >= 0) used.add(i);
      out[bd.key] = i >= 0 ? i : null;
    }
  }
  if (tplKey === "stream") {
    const free = i => i !== out.x;
    out.values = headers.map((_, i) => i).filter(i => free(i) && isNum(i) && !/^(rank|total|#|no\.?)$/i.test(str(headers[i])));
    if (!out.values.length) {
      // the text column with a handful of distinct values (2 to 16), as many as possible
      const cand = headers.map((_, i) => i).filter(i => free(i) && isText(i)).map(i => [i, new Set(body.map(r => str(r[i])).filter(Boolean)).size]).filter(([, k]) => k >= 2 && k <= 16);
      const best = d3.greatest(cand, c => c[1]);
      if (best) out.group = best[0];
    }
    return out;
  }
  // keep optional bindings from before when the column still exists
  if (previous) for (const bd of tpl.bindings) if (bd.optional && previous[bd.key] != null && previous[bd.key] < headers.length && !used.has(previous[bd.key])) out[bd.key] = previous[bd.key];
  return out;
}

// problems worth telling the author about; the editor shows them under the bindings
function check(project) {
  const tpl = TEMPLATES[project.template];
  const msgs = [];
  if (!tpl) return ["Unknown template."];
  const headers = project.data[0] || [];
  const body = project.data.slice(1);
  for (const bd of tpl.bindings) {
    const v = project.bindings[bd.key];
    const cols = Array.isArray(v) ? v : v == null ? [] : [v];
    if (!bd.optional && !cols.length) msgs.push(`Choose a column for “${bd.label}”.`);
    if (bd.type === "columns" && bd.min && cols.length && cols.length < bd.min) msgs.push(`“${bd.label}” needs at least ${bd.min} columns.`);
    if (bd.prefer === "number" && !bd.allowText) for (const c of cols) {
      const bad = body.filter(r => str(r[c]) && isNaN(parseNum(r[c]))).length;
      if (bad) msgs.push(`Column ${colName(c)} (${str(headers[c]) || "untitled"}) has ${bad} cell${bad > 1 ? "s" : ""} that aren't numbers; they are skipped.`);
    }
  }
  if (project.template === "map" && project.bindings.label != null && global.FL_GEO && global.FL_GEO.india) {
    const index = stateIndex(global.FL_GEO.india), c = project.bindings.label;
    const unknown = [...new Set(body.map(r => str(r[c])).filter(n => n && !index(n) && !index.skip(n)))];
    if (unknown.length) msgs.push(`${unknown.length} name${unknown.length > 1 ? "s don't" : " doesn't"} match an Indian state or UT and ${unknown.length > 1 ? "are" : "is"} left off the map: ${unknown.slice(0, 6).join(", ")}${unknown.length > 6 ? "…" : ""}.`);
  }
  if (project.template === "stream" && project.bindings.group == null && !(project.bindings.values || []).length)
    msgs.push("Pick number columns under “Values” (a table already counted), or a column under “Or: streams from this column” to count rows per period.");
  // pie values that are already percentages make "Value" and "Percent" labels identical
  if (project.template === "pie" && project.bindings.value != null) {
    const s = { ...defaults("pie"), ...project.settings };
    const sum = d3.sum(body, r => Math.max(0, parseNum(r[project.bindings.value]) || 0));
    if (/value/.test(s.sliceLabels) && /%/.test(s.suffix || "") && Math.abs(sum - 100) < 0.6)
      msgs.push(`The values in column ${colName(project.bindings.value)} already add up to 100 and the number format adds “%”, so value labels look the same as percent labels. Put the original amounts in the sheet (and clear the % suffix under Number format) to show them.`);
  }
  return msgs;
}

// ------------------------------------------------------------------ export: one flat SVG built from the live layout
// Header, legend and footer are HTML; their text is re-created as SVG <text> at the exact positions the browser
// laid them out (one element per line), so wrapping and fonts match the preview without a second layout engine.
function toSVG(inst) {

  }

    let tn;

      const par = tn.parentElement;
      if (!par || par.closest(".fl-controls") || par.closest(".fl-plot")) continue;

      }

  };

    if (!part || !part.textContent) continue;

      const r = rel(sw.getBoundingClientRect());
      out.push(`<rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${r.w.toFixed(1)}" height="${r.h.toFixed(1)}" rx="${sw.classList.contains("dot") ? r.w / 2 : 2}" fill="${getComputedStyle(sw).backgroundColor}"/>`);

    }
  }

    const r = rel(svg.parentNode.getBoundingClientRect());
    const clone = svg.cloneNode(true);
    clone.querySelectorAll(".overlay,.crosshair,.fl-axhit").forEach(n => n.remove());
    clone.querySelectorAll("[data-ck]").forEach(n => { n.removeAttribute("data-ck"); n.removeAttribute("data-ck2"); });

    clone.querySelectorAll(".fl-psel").forEach(n => n.classList.remove("fl-psel"));
    clone.querySelectorAll(".fl-painted").forEach(n => n.classList.remove("fl-painted"));
    clone.querySelectorAll("[data-lk],[data-part]").forEach(n => {
      const tr = n.style.translate;
      n.style.translate = "";
      if (!n.getAttribute("style")) n.removeAttribute("style");
      n.removeAttribute("data-lk"); n.removeAttribute("data-part"); n.removeAttribute("data-move");

    nc.querySelectorAll(".fl-ed").forEach(n => n.remove());
    out.push(`<g class="notes">${nc.innerHTML}</g>`);
  }
  out.push("</svg>");

}

// Free layout everywhere: templates that don't list it yet get the section (the timeline has it under Hand edits;

for (const [k, tpl] of Object.entries(TEMPLATES)) {

}

// a template setting must never reuse a shared setting's key: the shared default would silently override it
const sharedKeys = new Set(SHARED.flatMap(sec => sec.items.map(it => it.key)));
for (const [k, tpl] of Object.entries(TEMPLATES)) for (const sec of tpl.settings) for (const it of sec.items)
  if (sharedKeys.has(it.key)) console.error(`Chart Studio: the ${k} setting "${it.key}" clashes with a shared setting`);

function matchState(name) {
  const g = global.FL_GEO && global.FL_GEO.india;

  const code = stateIndex(g)(name);
  return code ? g.states.find(st => st.code === code).name : null;
