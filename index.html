      return { key: series[j], series: series[j], j, row: d, v, a, z, missing: !Number.isFinite(v) };
    });
    // which segment carries the rounded end (outermost non-zero on each side)
    if (mode !== "grouped") {
      const lastPos = d.segs.filter(g => g.z > g.a).pop(), lastNeg = d.segs.filter(g => g.z < g.a).pop();
      d.segs.forEach(g => { g.end = g === lastPos || g === lastNeg; });
    } else d.segs.forEach(g => { g.end = true; });
  }
  return { data, series, mode };
}

function barLegend(ctx) {
  const { series } = barData(ctx);
  if (series.length > 1) return series.map(n => ({ name: n, color: ctx.colorOf(n) }));
  if (ctx.b.color != null) {
    const groups = [...new Set(ctx.rows.map(r => str(r[ctx.b.color])).filter(Boolean))];
    return groups.map(n => ({ name: n, color: ctx.colorOf(n) }));
  }
  return [];
}

function renderBars(ctx, horizontal) {
  const { s, svg, W, t, theme, font, fs } = ctx;
  const { data, series, mode } = barData(ctx);
  if (!data.length) return ctx.empty("Add a label column and at least one value column.");
  const segKey = g => g.row.group != null ? g.row.group : series.length > 1 ? g.series : "__single";
  const segColor = g => (series.length === 1 && ctx.override(g.row.name)) || ctx.colorOf(segKey(g));
  const muted = g => ctx.hl.size && !ctx.hl.has(g.row.name.toLowerCase()) && !ctx.hl.has(g.series.toLowerCase()) && !(g.row.group && ctx.hl.has(g.row.group.toLowerCase()));
  const vals = data.flatMap(d => d.segs.flatMap(g => [g.a, g.z]));
  const lo = Math.min(0, d3.min(vals)), hi = Math.max(0, d3.max(vals));
  const fmt = mode === "stacked100" ? makeFormat({ ...s, prefix: "", suffix: "%", decimals: 0 }) : ctx.fmt;
  const labelOf = g => mode === "grouped" ? fmt(g.v) : null;
  const totalLabel = d => mode === "stacked" ? ctx.fmt(d.total) : null;
  const valueTexts = data.flatMap(d => mode === "grouped" ? d.segs.map(labelOf) : mode === "stacked" ? [totalLabel(d)] : []);
  const valueW = s.labels && valueTexts.length ? d3.max(valueTexts, v => measure(v, fs, 600, font)) + 8 : 0;
  const rr = g => s.corners === "square" || !g.end ? 0 : s.corners === "pill" ? 999 : 4;
  const showAxis = s.axisLabels && !(s.labels && mode === "grouped" && !s.grid);

  if (horizontal) {
    const nameW = Math.min(d3.max(data, d => measure(d.name, fs, 400, font)) + 10, W * 0.38);
    const m = { top: showAxis ? fs + 10 : 4, right: Math.max(valueW, 8), bottom: 4, left: nameW };
    const rowH = Math.max(series.length > 1 && mode === "grouped" ? series.length * Math.max(10, fs * 0.9) + 10 : fs * 2.1, 18);
    const H = ctx.fixedH ? ctx.fixedH : data.length * rowH / (1 - s.barPadding * 0.4) + m.top + m.bottom;
    ctx.size(H);
    const y = d3.scaleBand(data.map(d => d.name), [m.top, H - m.bottom]).paddingInner(+s.barPadding).paddingOuter(+s.barPadding / 2);
    const inner = d3.scaleBand(series, [0, y.bandwidth()]).padding(mode === "grouped" && series.length > 1 ? 0.1 : 0);
    const x = axisScale(d3.scaleLinear().range([m.left, W - m.right]), lo, hi, s, "val").clamp(true);
    drawValueAxis(ctx, x, "x", m.top, H - m.bottom, showAxis, mode === "stacked100" ? fmt : null);
    ctx.axisHit("val", m.left - 6, 0, W - m.left - m.right + 12, m.top + 2, "Value axis", x);

    const rowsSel = layer(svg, "marks").selectAll("g.row").data(data, d => d.name).join(
      e => e.append("g").attr("class", "row").attr("opacity", 0).attr("transform", d => `translate(0,${y(d.name)})`),
      u => u, x_ => x_.transition(t).attr("opacity", 0).remove());
    rowsSel.transition(t).attr("opacity", 1).attr("transform", d => `translate(0,${y(d.name)})`);
    rowsSel.each(function (d) {
      const row = d3.select(this);
      const bh = mode === "grouped" ? inner.bandwidth() : y.bandwidth();
      const by = g => mode === "grouped" ? inner(g.series) : 0;
      const gap = mode === "grouped" ? 0 : 1;
      row.selectAll("path.seg").data(d.segs, g => g.key).join(
        e => e.append("path").attr("class", "seg").attr("d", g => rpath(x(0), by(g), 0, bh, rr(g), g.z < g.a ? "left" : "right")),
        u => u, x_ => x_.transition(t).attr("d", g => rpath(x(0), by(g), 0, bh, 0, "right")).remove())
        .call(ctx.hover, g => barTip(ctx, g, fmt))
        .attr("data-ck", segKey).attr("data-ck2", g => series.length === 1 ? g.row.name : null)
        .attr("data-part", g => `bar|${g.row.name}|${g.series}`).attr("data-move", "y")
        .transition(t)
        .attr("fill", g => muted(g) ? theme.other : segColor(g)).attr("opacity", g => muted(g) ? 0.55 : 1)
        .attr("d", g => {
          const x0 = x(Math.min(g.a, g.z)), x1 = x(Math.max(g.a, g.z));
          const w = Math.max(0, x1 - x0 - (g.end ? 0 : gap));
          return rpath(x0 + (g.z < g.a && !g.end ? gap : 0), by(g), w, bh, rr(g), g.z < g.a ? "left" : "right");
        });
      row.selectAll("text.name").data([d]).join("text").attr("class", "name").attr("data-part", `cat|${d.name}`)
        .attr("x", m.left - 8).attr("y", y.bandwidth() / 2).attr("dy", "0.35em").attr("text-anchor", "end")
        .attr("fill", ctx.hl.size && !ctx.hl.has(d.name.toLowerCase()) ? theme.muted : theme.ink)
        .attr("font-weight", ctx.hl.has(d.name.toLowerCase()) ? 700 : 400)
        .text(fit(d.name, m.left - 9, fs, 400, font));
      const labs = !s.labels ? [] : mode === "grouped" ? d.segs.filter(g => !g.missing) : mode === "stacked" ? [{ key: "__total", total: true, v: d.total, z: d3.max(d.segs, g => g.z), a: 0, row: d, series: "" }] : [];
      row.selectAll("text.val").data(labs, g => g.key).join(
        e => e.append("text").attr("class", "val").attr("x", x(0)).attr("opacity", 0),
        u => u, x_ => x_.remove())
        .attr("data-lk", g => `val|${d.name}|${g.total ? "__total" : g.series}`).attr("data-part", g => `vlabel|${d.name}|${g.total ? "__total" : g.series}`)
        .attr("y", g => (g.total ? 0 : by(g)) + (g.total ? y.bandwidth() : bh) / 2).attr("dy", "0.35em")
        .attr("font-weight", 600)
        .attr("text-anchor", g => (g.z < 0 ? "end" : "start"))
        .attr("fill", g => s.labelColor && !g.total ? segColor(g) : theme.ink2)
        .transition(t).attr("opacity", g => muted({ ...g, row: d, series: g.series || "" }) ? 0.5 : 1)
        .attr("x", g => x(g.z) + (g.z < 0 ? -5 : 5))
        .tween("text", function (g) { return ctx.numTween(this, g.v, g.total ? ctx.fmt : fmt); });
    });
  } else {
    const H = ctx.fixedH || Math.max(260, Math.min(520, W * 0.56));
    ctx.size(H);
    const yTmp = axisScale(d3.scaleLinear(), lo, hi, s, "val");
    const tmpTicks = ticksOf(yTmp, 5);
    const tickW = showAxis ? d3.max(tmpTicks, v => measure((mode === "stacked100" ? fmt : ctx.fmt.axis(tmpTicks))(v), fs * 0.86, 400, font)) + 10 : 0;
    const maxName = d3.max(data, d => measure(d.name, fs * 0.9, 400, font));
    const band0 = (W - tickW) / data.length, every = Math.max(1, +s.catEvery || 1);
    const rotate = maxName > band0 * every * 0.95;
    const m = { top: s.labels ? fs + 8 : 8, right: 4, bottom: rotate ? Math.min(maxName * 0.72 + 14, H * 0.32) : fs + 14, left: tickW };
    const x = d3.scaleBand(data.map(d => d.name), [m.left, W - m.right]).paddingInner(+s.barPadding).paddingOuter(+s.barPadding / 2);
    const inner = d3.scaleBand(series, [0, x.bandwidth()]).padding(mode === "grouped" && series.length > 1 ? 0.08 : 0);
    const y = axisScale(d3.scaleLinear().range([H - m.bottom, m.top]), lo, hi, s, "val").clamp(true);
    drawValueAxis(ctx, y, "y", m.left, W - m.right, showAxis, mode === "stacked100" ? fmt : null);
    ctx.axisHit("val", 0, m.top - 6, Math.max(m.left, 28), H - m.top - m.bottom + 12, "Value axis", y);
    const colsSel = layer(svg, "marks").selectAll("g.row").data(data, d => d.name).join(
      e => e.append("g").attr("class", "row").attr("opacity", 0).attr("transform", d => `translate(${x(d.name)},0)`),
      u => u, x_ => x_.transition(t).attr("opacity", 0).remove());
    colsSel.transition(t).attr("opacity", 1).attr("transform", d => `translate(${x(d.name)},0)`);
    colsSel.each(function (d) {
      const col = d3.select(this);
      const bw = mode === "grouped" ? inner.bandwidth() : x.bandwidth();
      const bx = g => mode === "grouped" ? inner(g.series) : 0;
      const gap = mode === "grouped" ? 0 : 1;
      col.selectAll("path.seg").data(d.segs, g => g.key).join(
        e => e.append("path").attr("class", "seg").attr("d", g => rpath(bx(g), y(0), bw, 0, rr(g), g.z < g.a ? "bottom" : "top")),
        u => u, x_ => x_.transition(t).attr("d", g => rpath(bx(g), y(0), bw, 0, 0, "top")).remove())
        .call(ctx.hover, g => barTip(ctx, g, fmt))
        .attr("data-ck", segKey).attr("data-ck2", g => series.length === 1 ? g.row.name : null)
        .attr("data-part", g => `bar|${g.row.name}|${g.series}`).attr("data-move", "x")
        .transition(t)
        .attr("fill", g => muted(g) ? theme.other : segColor(g)).attr("opacity", g => muted(g) ? 0.55 : 1)
        .attr("d", g => {
          const y0 = y(Math.max(g.a, g.z)), y1 = y(Math.min(g.a, g.z));
          const h = Math.max(0, y1 - y0 - (g.end ? 0 : gap));
          return rpath(bx(g), y0 + (g.z > g.a && !g.end ? gap : 0), bw, h, rr(g), g.z < g.a ? "bottom" : "top");
        });
      const nm = col.selectAll("text.name").data(data.indexOf(d) % every === 0 ? [d] : []).join("text").attr("class", "name").attr("data-part", `cat|${d.name}`)
        .attr("fill", ctx.hl.size && !ctx.hl.has(d.name.toLowerCase()) ? theme.muted : theme.ink)
        .attr("font-size", fs * 0.9)
        .attr("font-weight", ctx.hl.has(d.name.toLowerCase()) ? 700 : 400);
      if (rotate) nm.attr("text-anchor", "end").attr("transform", `translate(${x.bandwidth() / 2},${H - m.bottom + 10}) rotate(-40)`).attr("x", 0).attr("y", 0).attr("dy", "0.35em")
        .text(fit(d.name, (m.bottom - 14) / 0.72, fs * 0.9, 400, font));
      else nm.attr("text-anchor", "middle").attr("transform", null).attr("x", x.bandwidth() / 2).attr("y", H - m.bottom + 6).attr("dy", "0.9em")
        .text(fit(d.name, x.step() * every - 2, fs * 0.9, 400, font));
      const labs = !s.labels ? [] : mode === "grouped" ? d.segs.filter(g => !g.missing) : mode === "stacked" ? [{ key: "__total", total: true, v: d.total, z: d3.max(d.segs, g => g.z), a: 0, row: d, series: "" }] : [];
      const lfs = mode === "grouped" && series.length > 1 ? Math.min(fs * 0.8, bw * 0.9) : fs * 0.86;
      col.selectAll("text.val").data(labs, g => g.key).join(
        e => e.append("text").attr("class", "val").attr("y", y(0)).attr("opacity", 0),
        u => u, x_ => x_.remove())
        .attr("data-lk", g => `val|${d.name}|${g.total ? "__total" : g.series}`).attr("data-part", g => `vlabel|${d.name}|${g.total ? "__total" : g.series}`)
        .attr("x", g => (g.total ? x.bandwidth() : bw) / 2 + (g.total ? 0 : bx(g))).attr("text-anchor", "middle")
        .attr("font-size", lfs).attr("font-weight", 600)
        .attr("fill", g => s.labelColor && !g.total ? segColor(g) : theme.ink2)
        .transition(t).attr("opacity", 1)
        .attr("y", g => y(g.z) + (g.z < 0 ? lfs + 4 : -5))
        .tween("text", function (g) { return ctx.numTween(this, g.v, g.total ? ctx.fmt : fmt); });
    });
  }
}

function barTip(ctx, g, fmt) {
  const d = g.row;
  const rows = d.segs.map(x => ({ name: x.series, value: x.missing ? "–" : fmt === ctx.fmt ? ctx.fmt(x.v) : `${ctx.fmt(x.v)}`, color: d.group != null ? ctx.colorOf(d.group) : ctx.colorOf(d.segs.length > 1 ? x.series : "__single"), active: x === g }));
  if (d.total != null && d.segs.length > 1) rows.push({ name: "Total", value: ctx.fmt(d.total), strong: true });
  return { title: d.name + (d.group ? ` · ${d.group}` : ""), rows };
}

// value axis + gridlines for bars/columns/lines (x for horizontal bars, y otherwise)
function drawValueAxis(ctx, scale, dir, a0, a1, showLabels, fmtOverride) {
  const { svg, t, theme, s, fs } = ctx;
  const ticks = ticksOf(scale, dir === "x" ? Math.max(2, Math.floor(ctx.W / 110)) : 5);
  const f = fmtOverride || ctx.fmt.axis(ticks);
  const g = layer(svg, "axis");
  g.lower();
  const sel = g.selectAll("g.tick").data(ticks, v => v).join(
    e => {
      const n = e.append("g").attr("class", "tick").attr("opacity", 0)
        .attr("transform", v => dir === "x" ? `translate(${scale(v)},0)` : `translate(0,${scale(v)})`);
      n.append("line"); n.append("text");
      return n;
    }, u => u, x_ => x_.transition(t).attr("opacity", 0).remove());
  sel.transition(t).attr("opacity", 1).attr("transform", v => dir === "x" ? `translate(${scale(v)},0)` : `translate(0,${scale(v)})`);
  sel.select("line")
    .attr("stroke", v => v === 0 ? theme.axis : theme.grid).attr("stroke-width", 1)
    .attr("opacity", v => v === 0 || s.grid ? 1 : 0)
    .attr("x1", dir === "x" ? 0 : a0).attr("x2", dir === "x" ? 0 : a1)
    .attr("y1", dir === "x" ? a0 : 0).attr("y2", dir === "x" ? a1 : 0);
  sel.select("text").attr("data-part", v => `tick|${dir}|${v}`).attr("fill", theme.muted).attr("font-size", fs * 0.86)
    .attr("opacity", showLabels ? 1 : 0)
    .attr("text-anchor", dir === "x" ? "middle" : "end")
    .attr("x", dir === "x" ? 0 : a0 - 6).attr("y", dir === "x" ? a0 - 8 : 0).attr("dy", dir === "x" ? 0 : "0.32em")
    .text(f);
}

// ---- line & area --------------------------------------------------------------------------------------
TEMPLATES.line = {
  name: "Line chart",
  blurb: "Change over time for one to eight series",
  bindings: [
    { key: "x", label: "X axis (time)", type: "column", prefer: "date" },
    { key: "values", label: "Values", type: "columns", prefer: "number", min: 1 },
  ],
  settings: [
    { section: "Lines", items: [
      { key: "kind", label: "Chart type", type: "select", default: "line", options: [["line", "Line"], ["area", "Line with area"], ["stacked", "Stacked area"]] },
      { key: "curve", label: "Curve", type: "select", default: "monotone", options: [["linear", "Straight"], ["monotone", "Smooth"], ["step", "Step"]] },
      { key: "lineWidth", label: "Line width", type: "range", min: 1, max: 6, step: 0.5, default: 2.5 },
      { key: "markers", label: "Point markers", type: "select", default: "auto", options: [["auto", "When few points"], ["on", "Always"], ["off", "Never"]] },
      { key: "endLabels", label: "Name lines at their ends", type: "select", default: "auto", options: [["auto", "Up to 6 series"], ["on", "Always"], ["off", "Never"]] },
      { key: "yZero", label: "Y axis starts at zero", type: "toggle", default: true },
    ] },
    AXES([{ key: "yTitle", label: "Y axis title", type: "text", default: "" }, ...RANGE("val", "Y axis"),
      ...RANGE("x", "X axis", "X range works when the X column holds numbers or years. Or double-click an axis in the preview."),
      { key: "xEvery", label: "X axis: label every", type: "select", default: "0", options: [["0", "Automatic"], ["1", "Every point"], ["2", "Every 2nd point"], ["3", "Every 3rd point"], ["4", "Every 4th point"], ["5", "Every 5th point"], ["6", "Every 6th point"], ["12", "Every 12th point"]],
        help: "When the X column holds names or months (text)." },
      { key: "xDateEvery", label: "X axis: a date every", type: "select", default: "", options: [["", "Automatic"], ["1m", "Month"], ["3m", "Quarter"], ["6m", "Half year"], ["1y", "Year"], ["2y", "2 years"], ["5y", "5 years"], ["10y", "10 years"]],
        help: "When the X column holds dates." }]),
  ],
  render: renderLine,
  legend: ctx => ctx.b.values.map(i => ({ name: ctx.headers[i], color: ctx.colorOf(ctx.headers[i]), shape: "line" })),
};

function lineData(ctx) {
  const { rows, b, headers } = ctx;
  const xt = columnType(rows.map(r => r[b.x]));
  const xOf = r => xt === "date" ? parseDate(r[b.x]) : xt === "year" || xt === "number" ? parseNum(r[b.x]) : str(r[b.x]);
  let pts = rows.map(r => ({ x: xOf(r), label: str(r[b.x]), vals: b.values.map(i => parseNum(r[i])) }))
    .filter(p => p.x != null && p.x !== "" && !(typeof p.x === "number" && isNaN(p.x)));
  if (xt !== "text") pts.sort((a, c) => a.x - c.x);
  const series = b.values.map(i => headers[i]);
  return { pts, series, xt };
}

function renderLine(ctx) {
  const { s, svg, W, t, theme, font, fs } = ctx;
  const { pts, series, xt } = lineData(ctx);
  if (pts.length < 2) return ctx.empty("A line needs an X column and at least two rows of values.");
  const stacked = s.kind === "stacked";
  let stackedVals = null;
  if (stacked) {
    stackedVals = pts.map(p => { let acc = 0; return p.vals.map(v => [acc, acc += Number.isFinite(v) ? Math.max(0, v) : 0]); });
  }
  const H = ctx.fixedH || Math.max(260, Math.min(520, W * 0.55));
  ctx.size(H);
  const all = stacked ? stackedVals.flat(2) : pts.flatMap(p => p.vals).filter(Number.isFinite);
  let lo = d3.min(all), hi = d3.max(all);
  if (s.yZero || stacked || s.kind === "area") lo = Math.min(0, lo);
  if (lo === hi) { hi += 1; lo -= lo === 0 ? 0 : 1; }
  const yTmp = axisScale(d3.scaleLinear(), lo, hi, s, "val");
  const ticks = ticksOf(yTmp, 5);
  const yf = ctx.fmt.axis(ticks);
  const tickW = s.axisLabels ? d3.max(ticks, v => measure(yf(v), fs * 0.86, 400, font)) + 10 : 4;
  const endOn = s.endLabels === "on" || (s.endLabels === "auto" && series.length <= 6);
  const endW = endOn ? Math.min(d3.max(series, n => measure(n, fs * 0.9, 600, font)) + 14, W * 0.3) : 10;
  const m = { top: s.yTitle ? fs + 14 : 10, right: endW, bottom: fs + 16, left: tickW };
  const y = axisScale(d3.scaleLinear().range([H - m.bottom, m.top]), lo, hi, s, "val");
  let x;
  if (xt === "date") x = d3.scaleTime(d3.extent(pts, p => p.x), [m.left, W - m.right]);
  else if (xt === "text") x = d3.scalePoint(pts.map(p => p.x), [m.left, W - m.right]);
  else { const [e0, e1] = d3.extent(pts, p => p.x); x = axisScale(d3.scaleLinear().range([m.left, W - m.right]), e0, e1, s, "x", false); }
  drawValueAxis(ctx, y, "y", m.left, W - m.right, s.axisLabels);
  ctx.axisHit("val", 0, m.top - 6, Math.max(m.left, 28), H - m.top - m.bottom + 12, "Y axis", y);
  if (xt === "number" || xt === "year") ctx.axisHit("x", m.left - 10, H - m.bottom + 2, W - m.left - m.right + 20, m.bottom - 2, "X axis", x);
  const clipped = y._fixed || x._fixed;
  // x axis
  const xg = layer(svg, "xaxis");
  let xticks, xfmt;
  if (xt === "text") {
    const every = +s.xEvery > 0 ? +s.xEvery : Math.ceil(pts.length / Math.max(2, Math.floor((W - m.left - m.right) / (d3.max(pts, p => measure(p.label, fs * 0.86, 400, font)) + 16))));
    xticks = pts.filter((p, i) => i % every === 0).map(p => p.x); xfmt = v => v;
  } else if (xt === "date") {
    const de = /^(\d+)([my])$/.exec(s.xDateEvery || "");
    const iv = de ? (de[2] === "m" ? d3.timeMonth : d3.timeYear).every(+de[1]) : null;
    xticks = iv ? x.ticks(iv) : x.ticks(Math.max(2, Math.floor(W / 120)));
    if (xticks.length > 60) xticks = x.ticks(Math.max(2, Math.floor(W / 120)));
    xfmt = de && de[2] === "y" ? d3.timeFormat("%Y") : x.tickFormat();
  }
  else { xticks = ticksOf(x, Math.max(2, Math.floor(W / 100))).filter(v => x._step && xt !== "year" ? true : Number.isInteger(v)); xfmt = xt === "year" ? d3.format("d") : ctx.fmt.axis(xticks); }
  xg.selectAll("text").data(xticks, v => +v || v).join("text").attr("data-part", v => `tick|xl|${+v || v}`).attr("fill", theme.muted).attr("font-size", fs * 0.86)
    .attr("text-anchor", "middle").attr("y", H - m.bottom + fs + 4)
    .transition(t).attr("x", v => x(v)).text(xfmt);
  layer(svg, "ytitle", "text").attr("x", m.left - tickW).attr("y", fs * 0.9).attr("fill", theme.muted).attr("font-size", fs * 0.86).text(s.yTitle || "");

  const curve = s.curve === "step" ? d3.curveStepAfter : s.curve === "monotone" ? (xt === "text" ? d3.curveMonotoneX : d3.curveMonotoneX) : d3.curveLinear;
  const muted = n => ctx.hl.size && !ctx.hl.has(n.toLowerCase());
  const sdata = series.map((name, j) => ({ name, j, points: pts.map((p, k) => ({ x: p.x, v: p.vals[j], y0: stacked ? stackedVals[k][j][0] : lo, y1: stacked ? stackedVals[k][j][1] : p.vals[j] })) }));
  const line = d3.line().defined(p => Number.isFinite(p.v)).curve(curve).x(p => x(p.x)).y(p => y(p.y1));
  const [d0, d1] = y.domain();

  ctx.clip(layer(svg, "marks"), clipped ? [m.left - 6, m.top - 6, W - m.left - m.right + 12, H - m.top - m.bottom + 12] : null);
  const order = [...sdata].sort((a, c) => (muted(c.name) ? 0 : 1) - (muted(a.name) ? 0 : 1));
  const gs = layer(svg, "marks").selectAll("g.series").data(order, d => d.name).join(e => { const n = e.append("g").attr("class", "series"); n.append("path").attr("class", "area"); n.append("path").attr("class", "line"); return n; }, u => u, x_ => x_.remove());
  gs.order();

  gs.select("path.area").attr("fill", d => muted(d.name) ? theme.other : ctx.colorOf(d.name))

    .attr("d", d => area(d.points));
  const lp = gs.select("path.line").attr("fill", "none").attr("stroke-linejoin", "round").attr("stroke-linecap", "round")
    .attr("stroke", d => muted(d.name) ? theme.other : ctx.colorOf(d.name)).attr("stroke-width", d => muted(d.name) ? Math.max(1, s.lineWidth * 0.6) : s.lineWidth);
  if (first && ctx.dur) {
    lp.attr("d", d => line(d.points)).each(function () {

      d3.select(this).attr("stroke-dasharray", `${L} ${L}`).attr("stroke-dashoffset", L).transition(t).duration(ctx.dur * 1.6).ease(d3.easeCubicOut).attr("stroke-dashoffset", 0).on("end", function () { d3.select(this).attr("stroke-dasharray", null); });
    });
  } else lp.attr("stroke-dasharray", null).transition(t).attr("d", d => line(d.points));

  gs.selectAll("circle.pt").data(d => showMarkers ? d.points.filter(p => Number.isFinite(p.v)).map(p => ({ ...p, name: d.name })) : [], p => +p.x || p.x)
    .join(e => e.append("circle").attr("class", "pt").attr("r", 0).attr("cx", p => x(p.x)).attr("cy", p => y(p.y1)), u => u, x_ => x_.remove())
    .attr("data-part", p => `point|${p.name}|${+p.x || p.x}`).attr("data-move", "none")
    .attr("fill", p => muted(p.name) ? theme.other : ctx.colorOf(p.name)).attr("stroke", theme.surface).attr("stroke-width", 1.5)
    .transition(t).attr("r", Math.max(3, s.lineWidth + 1)).attr("cx", p => x(p.x)).attr("cy", p => y(p.y1));

  const gapY = fs * 1.05;

    .attr("data-lk", d => `end|${d.name}`).attr("font-weight", 600).attr("font-size", fs * 0.9).attr("dy", "0.35em")
    .attr("fill", d => muted(d.name) ? theme.muted : theme.ink)

      .attr("fill", d => ctx.colorOf(d.name)).attr("stroke", theme.surface).attr("stroke-width", 2);

}

TEMPLATES.stream = {

  blurb: "Many series flowing around a centre line, with notes that point at the moments that matter",
  bindings: [

    { key: "group", label: "Or: streams from this column", type: "column", prefer: "text", optional: true,

  ],
  settings: [

      { key: "order", label: "Stream order", type: "select", default: "insideOut", options: [["insideOut", "Biggest in the middle"], ["data", "Column order"], ["desc", "Biggest at the bottom"]] },
      { key: "smooth", label: "Smoothing", type: "select", default: "1", options: [["1", "None"], ["2", "Average of 2 points"], ["3", "Average of 3 points"], ["4", "Average of 4 points"], ["6", "Average of 6 points"], ["12", "Average of 12 points"]],

// periods for grouping dates: the start of each, a step, and a label
const BUCKETS = {
  month: { floor: d3.timeMonth.floor, every: d3.timeMonth, label: d3.timeFormat("%b %Y") },
  quarter: { floor: d => new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1), every: d3.timeMonth.every(3), label: d => `Q${Math.floor(d.getMonth() / 3) + 1} ${d.getFullYear()}` },
  year: { floor: d3.timeYear.floor, every: d3.timeYear, label: d3.timeFormat("%Y") },
};
// {pts, series, xt, label}: wide tables are read as they are; with a "streams from" column, rows are counted
// (or a value column summed) per period and group
function streamData(ctx) {
  const { rows, b, s } = ctx;
  if (b.group == null) {
    const out = lineData(ctx);
    // name periods the way the data steps: quarters, years, or months
    const gaps = out.xt === "date" ? out.pts.slice(1).map((p, i) => d3.timeMonth.count(out.pts[i].x, p.x)) : [];
    const step = gaps.length ? d3.median(gaps) : 0;
    const bk = step === 3 ? BUCKETS.quarter : step === 12 ? BUCKETS.year : step === 1 ? BUCKETS.month : null;
    return { ...out, label: p => bk ? bk.label(p.x) : out.xt === "date" ? d3.timeFormat(p.x.getDate() === 1 ? "%b %Y" : "%d %b %Y")(p.x) : p.label };
  }
  const xt = columnType(rows.map(r => r[b.x]));
  const valCol = b.values.length ? b.values[0] : null;
  const keyOf = r => xt === "date" ? parseDate(r[b.x]) : xt === "year" || xt === "number" ? parseNum(r[b.x]) : str(r[b.x]);
  const items = rows.map(r => ({ x: keyOf(r), g: str(r[b.group]) || "(blank)", v: valCol == null ? 1 : parseNum(r[valCol]) }))
    .filter(d => d.x != null && d.x !== "" && !(typeof d.x === "number" && isNaN(d.x)) && Number.isFinite(d.v));
  let bk = null;
  if (xt === "date" && items.length) {
    const [a, z] = d3.extent(items, d => d.x), months = d3.timeMonth.count(a, z);
    const distinct = new Set(items.map(d => +d.x)).size;
    const want = s.bucket === "auto" ? (distinct <= 60 ? "none" : months <= 120 ? "month" : months <= 360 ? "quarter" : "year") : s.bucket;
    bk = BUCKETS[want] || null;
    if (bk) items.forEach(d => { d.x = bk.floor(d.x); });
  }
  // groups by size; past the limit they join "Other"
  const totals = d3.rollup(items, v => d3.sum(v, d => d.v), d => d.g);
  let groups = [...totals.keys()].sort((p, q) => totals.get(q) - totals.get(p));
  const max = +s.maxStreams || Infinity;
  if (groups.length > max) {
    const keep = new Set(groups.filter(g => g !== "Other").slice(0, max - 1));
    items.forEach(d => { if (!keep.has(d.g)) d.g = "Other"; });
    groups = [...keep, "Other"];
  } else if (groups.includes("Other")) groups = [...groups.filter(g => g !== "Other"), "Other"];
  // every period, including empty ones, so streams thin to nothing instead of jumping
  const kx = x => x instanceof Date ? +x : x;
  let xsAll;
  if (bk) { const [a, z] = d3.extent(items, d => +d.x); xsAll = bk.every.range(new Date(a), new Date(z + 1)); }
  else if (xt === "text") xsAll = [...new Set(items.map(d => d.x))];
  else xsAll = [...new Set(items.map(d => kx(d.x)))].sort((p, q) => p - q).map(v => xt === "date" ? new Date(v) : v);
  const sum = d3.rollup(items, v => d3.sum(v, d => d.v), d => kx(d.x), d => d.g);
  const pts = xsAll.map(x => { const m = sum.get(kx(x)); return { x, label: String(x), vals: groups.map(g => (m && m.get(g)) || 0) }; });
  const label = p => bk ? bk.label(p.x) : xt === "date" ? d3.timeFormat("%d %b %Y")(p.x) : String(p.x);
  return { pts, series: groups, xt, label };
}

function renderStream(ctx) {
  const { s, svg, W, t, theme, font, fs } = ctx;
  if (ctx.b.group == null && !ctx.b.values.length) return ctx.empty("Pick number columns under “Values”, or a column under “Or: streams from this column” to count rows (for one row per day or event).");
  const { pts, series, xt, label: periodLabel } = streamData(ctx);
  if (pts.length < 2) return ctx.empty("A streamgraph needs at least two periods on the X axis.");
  const n = series.length, N = pts.length;
  const raw = pts.map(p => p.vals.map(v => Number.isFinite(v) ? Math.max(0, v) : 0));
  // centred rolling average; the window shrinks at the ends instead of inventing values
  const k = Math.max(1, Math.min(N, +s.smooth || 1)), back = Math.floor((k - 1) / 2);
  const vals = k === 1 ? raw : raw.map((_, i) => {
    const a = Math.max(0, i - back), b = Math.min(N, i - back + k);
    return d3.range(n).map(j => d3.mean(raw.slice(a, b), r => r[j]));
  });
  const offset = { silhouette: d3.stackOffsetSilhouette, expand: d3.stackOffsetExpand, zero: d3.stackOffsetNone }[s.offset] || d3.stackOffsetWiggle;
  const order = s.order === "data" ? d3.stackOrderNone : s.order === "desc" ? d3.stackOrderDescending : d3.stackOrderInsideOut;
  const layers = d3.stack().keys(d3.range(n)).value((r, j) => r[j]).offset(offset).order(order)(vals);
  const byJ = []; layers.forEach(l => { byJ[l.key] = l; });
  let yMin = d3.min(layers, l => d3.min(l, d => d[0])), yMax = d3.max(layers, l => d3.max(l, d => d[1]));
  if (!(yMax > yMin)) { yMin = 0; yMax = 1; }
  const yMid = (yMin + yMax) / 2;
  const H = ctx.fixedH || Math.max(300, Math.min(580, W * 0.56));
  ctx.size(H);

  const m = { left: 2, right: 2 };
  let x;
  if (xt === "date") x = d3.scaleTime(d3.extent(pts, p => p.x), [m.left, W - m.right]);
  else if (xt === "text") x = d3.scalePoint(pts.map(p => p.x), [m.left, W - m.right]);
  else x = d3.scaleLinear(d3.extent(pts, p => p.x), [m.left, W - m.right]);
  const xs = pts.map(p => x(p.x));
  const fmtDate = d => xt === "date" ? d3.timeFormat(d.getDate() === 1 ? "%b %Y" : "%d %b %Y")(d) : String(d);

  // notes: "date | stream | text" or "date | text". A date belongs to the last period starting on or before it.
  const nfs = fs * 0.84, dfs = fs * 0.74;
  const notes = String(s.notes || "").split("\n").map(l => l.split("|").map(str)).filter(a => a.length >= 2 && a[0] && a[a.length - 1]).map((a, idx) => {
    const text = a.length >= 3 ? a.slice(2).join(" | ") : a[1], sname = a.length >= 3 ? a[1].toLowerCase() : "";
    let i = -1, when = a[0];
    if (xt === "date") {
      const d = parseDate(a[0]);
      if (!d) return null;
      const step = pts[N - 1].x - pts[N - 2].x;
      if (d < pts[0].x || +d >= +pts[N - 1].x + step) return null;
      i = d3.bisectRight(pts.map(p => +p.x), +d) - 1;
      when = fmtDate(d);
    } else if (xt === "text") i = pts.findIndex(p => p.label.toLowerCase() === a[0].toLowerCase());
    else { const v = parseNum(a[0]); if (Number.isFinite(v)) i = d3.bisectRight(pts.map(p => p.x), v) - 1; }
    if (i < 0) return null;
    let j = sname ? series.findIndex(nm => nm.toLowerCase() === sname) : -1;
    if (j < 0 && sname) j = series.findIndex(nm => nm.toLowerCase().startsWith(sname));
    const lay = j >= 0 ? byJ[j][i] : null;
    const top = !lay || (lay[0] + lay[1]) / 2 >= yMid;
    const w = Math.max(measure(text, nfs, 650, font), s.noteDates ? measure(when, dfs, 400, font) : 0);
    return { key: "note" + idx, i, j, text, when, top, w, ax: xs[i], lx: Math.max(w / 2, Math.min(W - w / 2, xs[i])) };
  }).filter(Boolean);
  // rows: no two labels overlap, and no leader passes through a label nearer the streams
  const gapX = fs * 0.8, MAXR = W < 560 ? 2 : 4;
  for (const side of [true, false]) {
    const placed = [];
    for (const nt of notes.filter(q => q.top === side).sort((a, c) => a.ax - c.ax)) {
      const l0 = nt.lx - nt.w / 2 - gapX / 2, l1 = nt.lx + nt.w / 2 + gapX / 2;
      let r = 0;
      for (; r < MAXR; r++) {
        if (placed.every(p => p.row === r ? (l1 <= p.lx - p.w / 2 - gapX / 2 || l0 >= p.lx + p.w / 2 + gapX / 2)
          : p.row > r ? (p.ax < l0 || p.ax > l1) : (nt.ax < p.lx - p.w / 2 - 4 || nt.ax > p.lx + p.w / 2 + 4))) break;
      }
      if (r < MAXR) { nt.row = r; placed.push(nt); } else nt.num = true;
    }
  }
  // notes that found no room become numbered dots, explained in a key under the axis
  const numbered = notes.filter(q => q.num).sort((a, c) => a.ax - c.ax);
  numbered.forEach((q, i) => { q.n = i + 1; });
  const keyFs = fs * 0.8, keyLines = [];
  for (const q of numbered) {
    const item = `${q.n}  ${q.text}${s.noteDates ? `, ${q.when}` : ""}`, iw = measure(item, keyFs, 400, font) + fs;
    const last = keyLines[keyLines.length - 1];
    if (last && last.w + iw <= W) { last.items.push(item); last.w += iw; } else keyLines.push({ items: [item], w: iw });
  }
  const keyH = keyLines.length ? keyLines.length * keyFs * 1.35 + fs * 0.3 : 0;
  const rowH = (s.noteDates ? nfs + dfs * 1.25 : nfs) + fs * 0.5;
  const rowsTop = d3.max(notes.filter(q => q.top && !q.num), q => q.row + 1) || 0, rowsBot = d3.max(notes.filter(q => !q.top && !q.num), q => q.row + 1) || 0;
  const axisH = fs + 14 + keyH;
  const top = 6 + rowsTop * rowH + (rowsTop ? fs * 0.4 : 0), bottom = axisH + rowsBot * rowH + (rowsBot ? fs * 0.4 : 0);
  const y = d3.scaleLinear([yMin, yMax], [H - bottom, top]);

  // x axis and gridlines
  let xticks, xfmt;
  if (xt === "text") {
    const every = Math.ceil(N / Math.max(2, Math.floor(W / (d3.max(pts, p => measure(p.label, fs * 0.86, 400, font)) + 16))));
    xticks = pts.filter((p, i) => i % every === 0).map(p => p.x); xfmt = v => v;
  } else if (xt === "date") {
    const de = /^(\d+)([my])$/.exec(s.xDateEvery || "");
    const iv = de ? (de[2] === "m" ? d3.timeMonth : d3.timeYear).every(+de[1]) : null;
    xticks = iv ? x.ticks(iv) : x.ticks(Math.max(2, Math.floor(W / 90)));
    if (xticks.length > 60) xticks = x.ticks(Math.max(2, Math.floor(W / 90)));
    xfmt = (de && de[2] === "y") || xticks.every(d => d.getMonth() === 0) ? d3.timeFormat("%Y") : x.tickFormat();
  } else { xticks = x.ticks(Math.max(2, Math.floor(W / 90))).filter(v => xt !== "year" || Number.isInteger(v)); xfmt = xt === "year" ? d3.format("d") : ctx.fmt.axis(xticks); }
  const halfW = v => measure(String(xfmt(v)), fs * 0.86, 400, font) / 2;
  xticks = xticks.filter(v => x(v) - halfW(v) >= -1 && x(v) + halfW(v) <= W + 1);
  const gg = layer(svg, "grid"); gg.lower();
  gg.selectAll("line").data(s.grid ? xticks : [], v => +v || v).join("line").attr("stroke", theme.grid).attr("stroke-width", 1)
    .attr("y1", top - (rowsTop ? fs * 0.4 : 0)).attr("y2", H - axisH + 2).attr("x1", v => x(v)).attr("x2", v => x(v));
  layer(svg, "xaxis").selectAll("text").data(xticks, v => +v || v).join("text").attr("fill", theme.muted).attr("font-size", fs * 0.86)
    .attr("text-anchor", "middle").attr("y", H - axisH + fs + 4).transition(t).attr("x", v => x(v)).text(xfmt);
  layer(svg, "notekey").selectAll("text").data(keyLines).join("text").attr("font-size", keyFs).attr("fill", theme.ink2)
    .attr("x", 0).attr("y", (d, i) => H - keyH + fs * 0.3 + keyFs * (i + 0.95) * 1.35 - keyFs * 0.35).text(d => d.items.join("   "));

  // streams
  const muted = j => ctx.hl.size && !ctx.hl.has(series[j].toLowerCase());
  const colorJ = j => muted(j) ? theme.other : ctx.colorOf(series[j]);
  const curve = s.streamCurve === "linear" ? d3.curveLinear : s.streamCurve === "monotone" ? d3.curveMonotoneX : d3.curveBasis;
  const area = d3.area().curve(curve).x((d, i) => xs[i]).y0(d => y(d[0])).y1(d => y(d[1]));
  const centre = pts.map((_, i) => (d3.min(layers, l => l[i][0]) + d3.max(layers, l => l[i][1])) / 2);
  const flat = d3.area().curve(curve).x((d, i) => xs[i]).y0((d, i) => y(centre[i])).y1((d, i) => y(centre[i]));
  const sg = layer(svg, "marks");

function timelineCats(ctx) {

function renderScatter(ctx) {
  const { s, svg, W, t, theme, font, fs, b, headers } = ctx;

    .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y) && (!s.logX || p.x > 0) && (!s.logY || p.y > 0));
  if (!pts.length) return ctx.empty("Choose two number columns for X and Y.");
  const H = ctx.fixedH || Math.max(300, Math.min(600, W * 0.62));
  ctx.size(H);
  // scales use every row (all filter values) so the frame stays still while points move
  const allX = ctx.allRows.map(r => parseNum(r[b.x])).filter(v => Number.isFinite(v) && (!s.logX || v > 0));
  const allY = ctx.allRows.map(r => parseNum(r[b.y])).filter(v => Number.isFinite(v) && (!s.logY || v > 0));
  const allS = b.size != null ? ctx.allRows.map(r => parseNum(r[b.size])).filter(v => Number.isFinite(v) && v > 0) : [];
  const r = b.size != null ? d3.scaleSqrt([0, d3.max(allS) || 1], [s.minR, s.maxR]) : () => Math.max(s.minR, 5);
  const ySc = axisScale(s.logY ? d3.scaleLog() : d3.scaleLinear(), ...d3.extent(allY), s, "val");
  const yTicks = ticksOf(ySc, 5);
  const yf = s.logY ? ctx.fmt.axis(yTicks.filter((v, i, a) => a.length < 8 || /^[125]/.test(String(v)))) : ctx.fmt.axis(yTicks);
  const tickW = s.axisLabels ? d3.max(yTicks, v => measure(yf(v), fs * 0.86, 400, font)) + 10 : 6;
  const pad = b.size != null ? s.maxR * 0.6 : 10;
  const m = { top: fs + 16, right: 12 + pad * 0.5, bottom: fs * 2 + 22, left: tickW + 4 };
  const x = axisScale((s.logX ? d3.scaleLog() : d3.scaleLinear()).range([m.left + pad * 0.5, W - m.right]), ...d3.extent(allX), s, "x");
  const y = ySc.range([H - m.bottom - pad * 0.3, m.top]);
  // axes
  const ax = layer(svg, "axis"); ax.lower();
  const xt = ticksOf(x, Math.max(2, Math.floor(W / 110))).filter((v, i, a) => !s.logX || a.length < 8 || /^[125]/.test(String(v)));
  const xf = ctx.fmt.axis(xt);
  ax.selectAll("line.gx").data(xt, v => v).join("line").attr("class", "gx").attr("stroke", theme.grid).attr("opacity", s.grid ? 1 : 0)
    .attr("y1", m.top).attr("y2", H - m.bottom).transition(t).attr("x1", v => x(v)).attr("x2", v => x(v));
  ax.selectAll("text.tx").data(xt, v => v).join("text").attr("class", "tx").attr("data-part", v => `tick|x|${v}`).attr("fill", theme.muted).attr("font-size", fs * 0.86).attr("text-anchor", "middle")
    .attr("opacity", s.axisLabels ? 1 : 0).attr("y", H - m.bottom + fs + 4).transition(t).attr("x", v => x(v)).text(xf);
  const yt = yTicks.filter(v => !s.logY || yTicks.length < 8 || /^[125]/.test(String(v)));
  ax.selectAll("line.gy").data(yt, v => v).join("line").attr("class", "gy").attr("stroke", theme.grid).attr("opacity", s.grid ? 1 : 0)
    .attr("x1", m.left).attr("x2", W - m.right).transition(t).attr("y1", v => y(v)).attr("y2", v => y(v));
  ax.selectAll("text.ty").data(yt, v => v).join("text").attr("class", "ty").attr("data-part", v => `tick|y|${v}`).attr("fill", theme.muted).attr("font-size", fs * 0.86).attr("text-anchor", "end")
    .attr("opacity", s.axisLabels ? 1 : 0).attr("x", m.left - 6).attr("dy", "0.32em").transition(t).attr("y", v => y(v)).text(yf);
  layer(svg, "xtitle", "text").attr("x", W - m.right).attr("y", H - 4).attr("text-anchor", "end").attr("fill", theme.ink2).attr("font-size", fs * 0.9).attr("font-weight", 600).text((s.xTitle || headers[b.x]) + " →");
  layer(svg, "ytitle", "text").attr("x", 0).attr("y", fs * 0.9).attr("fill", theme.ink2).attr("font-size", fs * 0.9).attr("font-weight", 600).text("↑ " + (s.yTitle || headers[b.y]));
  // big filter value watermark (the Gapminder look)
  layer(svg, "watermark", "text").lower().attr("x", W - m.right - 4).attr("y", H - m.bottom - 10).attr("text-anchor", "end").attr("fill", theme.grid)
    .attr("font-size", Math.min(W / 7, 120)).attr("font-weight", 800).text(b.filter != null ? ctx.filterValue : "");
  const muted = p => ctx.hl.size && !ctx.hl.has(p.name.toLowerCase()) && !(p.group && ctx.hl.has(p.group.toLowerCase()));
  const sorted = [...pts].sort((a, c) => (muted(c) - muted(a)) || ((Number.isFinite(c.size) ? c.size : 0) - (Number.isFinite(a.size) ? a.size : 0)));
  const clipBox = x._fixed || y._fixed ? [m.left - 4, m.top - 4, W - m.left - m.right + 8, H - m.top - m.bottom + 8] : null;
  ctx.clip(layer(svg, "marks"), clipBox);
  ctx.clip(layer(svg, "labels"), clipBox);
  const dots = layer(svg, "marks").selectAll("circle").data(sorted, p => p.key).join(
    e => e.append("circle").attr("r", 0).attr("cx", p => x(p.x)).attr("cy", p => y(p.y)),
    u => u, x_ => x_.transition(t).attr("r", 0).remove());
  dots.order().attr("data-part", p => `point|${p.key}`).attr("data-move", "none").attr("stroke", theme.surface).attr("stroke-width", 1.5)
    .transition(t).attr("cx", p => x(p.x)).attr("cy", p => y(p.y)).attr("r", p => Number.isFinite(p.size) ? r(Math.max(0, p.size)) : r(0) || s.minR)
    .attr("fill", p => muted(p) ? theme.other : ctx.override(p.name) || (p.group != null ? ctx.colorOf(p.group) : ctx.colorOf("__single")))
    .attr("fill-opacity", p => muted(p) ? 0.45 : s.opacity);
  // names, skipping any that would collide with an earlier one
  const placed = [];
  const labs = s.pointLabels === "none" || b.label == null ? [] : sorted.filter(p => !muted(p)).reverse().filter(p => {
    if (s.pointLabels === "highlight" && !ctx.hl.has(p.name.toLowerCase())) return false;
    const rr = Number.isFinite(p.size) ? r(p.size) : 5, w = measure(p.name, fs * 0.82, 500, font);
    const box = { x0: x(p.x) - w / 2, x1: x(p.x) + w / 2, y0: y(p.y) - rr - fs - 2, y1: y(p.y) - rr - 2 };
    if (box.x0 < 0 || box.x1 > W || box.y0 < 0) return false;
    if (placed.some(q => !(box.x1 < q.x0 || box.x0 > q.x1 || box.y1 < q.y0 || box.y0 > q.y1))) return false;
    placed.push(box); return true;
  });
  layer(svg, "labels").attr("pointer-events", ctx.opts.editable ? null : "none").selectAll("text").data(labs, p => p.key).join(e => e.append("text").attr("opacity", 0).attr("x", p => x(p.x)).attr("y", p => y(p.y)), u => u, x_ => x_.remove())
    .attr("data-lk", p => `pt|${p.key}`).attr("text-anchor", "middle").attr("font-size", fs * 0.82).attr("font-weight", 500).attr("fill", theme.ink)
    .attr("stroke", theme.surface).attr("stroke-width", 3).attr("paint-order", "stroke")
    .transition(t).attr("opacity", 1).attr("x", p => x(p.x)).attr("y", p => y(p.y) - (Number.isFinite(p.size) ? r(p.size) : 5) - 4).text(p => p.name);
  // nearest-point hover so small dots are easy to hit
  const del = d3.Delaunay.from(pts, p => x(p.x), p => y(p.y));
  layer(svg, "overlay", "rect").attr("width", W).attr("height", H).attr("fill", "transparent")
    .on("pointermove", ev => {
      if (!s.tooltips) return;
      const [mx, my] = d3.pointer(ev, svg.node());
      const i = del.find(mx, my), p = pts[i];
      const rr = Number.isFinite(p.size) ? r(p.size) : 5;
      if (Math.hypot(x(p.x) - mx, y(p.y) - my) > Math.max(24, rr + 8)) { ctx.tip.hide(); dots.attr("stroke", theme.surface); return; }
      dots.attr("stroke", q => q === p ? theme.ink : theme.surface);
      const rows = [{ name: s.xTitle || headers[b.x], value: ctx.fmt(p.x) }, { name: s.yTitle || headers[b.y], value: ctx.fmt(p.y) }];
      if (b.size != null) rows.push({ name: headers[b.size], value: ctx.fmt(p.size) });
      ctx.tip.show(ev, { title: p.name || "Point", sub: p.group, rows, color: p.group != null ? ctx.colorOf(p.group) : null });
    }).on("pointerleave", () => { ctx.tip.hide(); dots.attr("stroke", theme.surface); })
    .on("click", ev => {
      if (!ctx.opts.editable) return;
      const [mx, my] = d3.pointer(ev, svg.node());
      const p = pts[del.find(mx, my)];
      if (!p || Math.hypot(x(p.x) - mx, y(p.y) - my) > Math.max(24, (Number.isFinite(p.size) ? r(p.size) : 5) + 8)) return;
      ctx.pickColor(p.group != null ? p.group : "__single", p.name || null, ev, ctx.override(p.name) || ctx.colorOf(p.group != null ? p.group : "__single"));
    });
  if (ctx.opts.editable) layer(svg, "labels").raise();
  ctx.axisHit("val", 0, m.top - 6, Math.max(m.left, 28), H - m.top - m.bottom + 12, "Y axis", y);
  ctx.axisHit("x", m.left - 10, H - m.bottom + 2, W - m.left - m.right + 20, fs + 12, "X axis", x);
}

TEMPLATES.pie = {
  name: "Pie & donut",
  blurb: "Parts of a whole, up to eight slices",
  bindings: [
    { key: "label", label: "Labels", type: "column", prefer: "text" },
    { key: "value", label: "Value", type: "column", prefer: "number" },
    { key: "filter", label: "Filter", type: "column", prefer: "any", optional: true },
  ],
  settings: [
    { section: "Slices", items: [
      { key: "hole", label: "Donut hole (%)", type: "range", min: 0, max: 85, step: 5, default: 55 },
      { key: "maxSlices", label: "Most slices before Other", type: "range", min: 2, max: 8, step: 1, default: 7 },
      { key: "sort", label: "Largest first", type: "toggle", default: true },
      { key: "sliceLabels", label: "Slice labels", type: "select", default: "percent", options: [["percent", "Percent"], ["value", "Value"], ["namepercent", "Name and percent"], ["namevalue", "Name and value"], ["name", "Name"], ["none", "None"]] },
      { key: "centerTotal", label: "Total in the middle", type: "toggle", default: true },
      { key: "centerLabel", label: "Caption under the total", type: "text", default: "Total", show: s => s.centerTotal },
      { key: "centerSize", label: "Centre number size (%)", type: "range", min: 50, max: 160, step: 5, default: 100, show: s => s.centerTotal },
      { key: "labelRadius", label: "Slice labels: inner edge to outer edge", type: "range", min: 0, max: 100, step: 5, default: 50,
        help: "Drag any label, or the centre total and caption, to move it; double-click it to put it back." },
    ] },
  ],
  render: renderPie,
  legend: ctx => pieItems(ctx).map(d => ({ name: d.name, color: d.color })),
};

function pieItems(ctx) {
  const { s, rows, b } = ctx;
  let items = rows.map(r => ({ name: str(r[b.label]), v: parseNum(r[b.value]) })).filter(d => d.name && d.v > 0);
  const merged = new Map();
  items.forEach(d => merged.set(d.name, (merged.get(d.name) || 0) + d.v));
  items = [...merged].map(([name, v]) => ({ name, v }));
  if (s.sort) items.sort((a, c) => c.v - a.v);
  const max = +s.maxSlices;
  if (items.length > max + 1) {
    const keep = s.sort ? items.slice(0, max) : [...items].sort((a, c) => c.v - a.v).slice(0, max);
    const keepSet = new Set(keep);
    const other = d3.sum(items.filter(d => !keepSet.has(d)), d => d.v);
    items = items.filter(d => keepSet.has(d)).concat([{ name: "Other", v: other, other: true }]);
  }
  items.forEach(d => { d.color = d.other ? ctx.override("Other") || ctx.theme.other : ctx.colorOf(d.name); });
  return items;
}

function renderPie(ctx) {
  const { s, svg, W, t, theme, fs, font } = ctx;
  const items = pieItems(ctx);
  if (!items.length) return ctx.empty("Choose a label column and a column of positive numbers.");
  const H = ctx.fixedH || Math.min(Math.max(280, W * 0.62), 480);
  ctx.size(H);
  const total = d3.sum(items, d => d.v);
  const arcs = d3.pie().sort(null).value(d => d.v)(items);
  // a label is one or two lines: an optional name over the number
  const pctOf = d => d3.format(".0%")(d.data.v / total);
  const labLines = d => {
    const num = /percent/.test(s.sliceLabels) ? pctOf(d) : ctx.fmt(d.data.v);
    return s.sliceLabels === "name" ? [d.data.name] : /^name/.test(s.sliceLabels) ? [d.data.name, num] : [num];
  };
  const lab = d => labLines(d).join(" \u00b7 ");
  const lfs = fs * 0.9;
  const labWidth = d => d3.max(labLines(d), (l, i) => measure(l, lfs, i === labLines(d).length - 1 && s.sliceLabels !== "name" ? 700 : 600, font));
  // a label goes inside its slice when it fits; smaller slices get an outside label with a leader line
  let R = Math.min(W, H) / 2 - 6, r0, lr;
  const fitsInside = d => (d.endAngle - d.startAngle) * lr > labWidth(d) + 8 && (R - r0) > lfs * (1.5 + 1.15 * (labLines(d).length - 1));
  // labelRadius 0..100 runs from the inner edge of the ring to the outer edge (from near the centre on a pie)
  const lpos = (s.labelRadius == null ? 50 : +s.labelRadius) / 100;
  const sizeFor = rad => { R = rad; r0 = R * s.hole / 100; lr = r0 > 0 ? r0 + (R - r0) * (0.15 + 0.7 * lpos) : R * (0.28 + 0.72 * lpos); };
  sizeFor(R);
  let outside = s.sliceLabels === "none" ? [] : arcs.filter(d => !fitsInside(d));
  if (outside.length) {
    const labW = d3.max(outside, d => measure(lab(d), lfs, 700, font));  // outside labels are one line
    sizeFor(Math.max(40, Math.min(W / 2 - labW - 26, H / 2 - lfs * 1.6)));
    outside = arcs.filter(d => !fitsInside(d));
  }
  const inside = s.sliceLabels === "none" ? [] : arcs.filter(fitsInside);
  const pad = r0 > 0 ? 0.008 : 0;
  arcs.forEach(d => { d.padAngle = pad; });
  const arc = d3.arc().innerRadius(r0).outerRadius(R).cornerRadius(r0 > 0 ? 3 : 0);
  const g = layer(svg, "marks").attr("transform", `translate(${W / 2},${H / 2})`);
  const muted = d => ctx.hl.size && !ctx.hl.has(d.data.name.toLowerCase());
  const paths = g.selectAll("path.sl").data(arcs, d => d.data.name).join(
    e => e.append("path").attr("class", "sl").each(function (d) { this._cur = { startAngle: d.startAngle, endAngle: d.startAngle, padAngle: 0 }; }),
    u => u, x_ => x_.transition(t).attrTween("d", function () { const i = d3.interpolate(this._cur, { ...this._cur, startAngle: this._cur.endAngle }); return k => arc(i(k)); }).remove());
  paths.attr("data-ck", d => d.data.name).attr("stroke", theme.surface).attr("stroke-width", r0 > 0 ? 0 : 1.5)
    .call(ctx.hover, d => ({ title: d.data.name, rows: [{ name: "Value", value: ctx.fmt(d.data.v) }, { name: "Share", value: d3.format(".1%")(d.data.v / total) }], color: d.data.color }))
    .transition(t).attr("fill", d => muted(d) ? theme.other : d.data.color).attr("opacity", d => muted(d) ? 0.5 : 1)
    .attrTween("d", function (d) { const i = d3.interpolate(this._cur, d); this._cur = i(1); return k => arc(i(k)); });
  // centred on the cap height, so digits sit in the visual middle rather than on the em box
  const capY = lfs * 0.36;
  const sl = g.selectAll("text.slice").data(inside, d => d.data.name).join(e => e.append("text").attr("class", "slice").attr("opacity", 0), u => u, x_ => x_.remove())
    .attr("data-lk", d => `slice|${d.data.name}`)
    .attr("text-anchor", "middle").attr("font-size", lfs).attr("pointer-events", ctx.opts.editable ? null : "none")
    .attr("fill", d => contrastInk(muted(d) ? theme.other : d.data.color));
  // two-line labels are centred as a block on the same point a one-line label uses
  sl.each(function (d) {
    const lines = labLines(d), n = lines.length;
    d3.select(this).selectAll("tspan").data(lines).join("tspan").attr("x", 0)
      .attr("dy", (l, i) => i ? "1.15em" : `${-(n - 1) * 0.575}em`)
      .attr("font-weight", (l, i) => i === n - 1 && s.sliceLabels !== "name" ? 700 : 600)
      .attr("opacity", (l, i) => n > 1 && i === 0 ? 0.9 : 1).text(l => l);
  });
  sl.transition(t).attr("opacity", 1).attr("transform", d => { const [cx, cy] = d3.arc().innerRadius(lr).outerRadius(lr).centroid(d); return `translate(${cx},${cy + capY})`; });
  // outside labels: placed on each side, then pushed apart vertically so they never overlap
  const ol = outside.map(d => {
    const a = (d.startAngle + d.endAngle) / 2, sx = Math.sin(a), sy = -Math.cos(a);
    return { d, key: d.data.name, side: sx >= 0 ? 1 : -1, ax: sx * (R + 2), ay: sy * (R + 2), ex: sx * (R + 10), ey: sy * (R + 10), y: sy * (R + 14) };
  });
  for (const side of [1, -1]) {
    const grp = spread(ol.filter(o => o.side === side), () => lfs * 1.3, -H / 2 + lfs * 0.9, H / 2 - lfs * 0.4);
    grp.forEach(o => { o.x = side * (R + 18); });
  }
  const og = g.selectAll("g.out").data(ol, o => o.key).join(e => { const n = e.append("g").attr("class", "out").attr("opacity", 0); n.append("polyline"); n.append("text"); return n; }, u => u, x_ => x_.remove());
  og.attr("pointer-events", ctx.opts.editable ? null : "none").transition(t).attr("opacity", 1);
  const offs = s.labelOffsets || {};
  og.select("polyline").attr("fill", "none").attr("stroke", theme.muted).attr("stroke-width", 1)
    .attr("points", o => { const [dx, dy] = offs[`slice|${o.key}`] || [0, 0]; return `${o.ax},${o.ay} ${o.ex},${o.ey} ${o.x - o.side * 4 + dx},${o.y - capY + dy}`; });
  og.select("text").attr("data-lk", o => `slice|${o.key}`).attr("x", o => o.x).attr("y", o => o.y).attr("text-anchor", o => o.side > 0 ? "start" : "end")
    .attr("font-weight", 700).attr("font-size", lfs).attr("fill", o => muted(o.d) ? theme.muted : theme.ink2).text(o => lab(o.d));
  // centre: the number and its caption are centred together as one block
  const center = s.centerTotal && r0 > fs * 2.5 ? [0] : [];
  // the number shrinks to fit the hole (a long total like "264.4 MMT/yr" would otherwise spill over the ring)
  let N = Math.min(r0 * 0.42, fs * 2.4) * (s.centerSize == null ? 1 : +s.centerSize / 100);
  const totalW = measure(ctx.fmt(total), N, 700, font);
  if (totalW > r0 * 1.6) N *= r0 * 1.6 / totalW;
  const L = fs * 0.86, gap = L * 0.55;
  const capTotal = s.centerLabel ? N * 0.72 + gap + L * 0.72 : N * 0.72;
  const cg = g.selectAll("g.center").data(center).join(e => { const n = e.append("g").attr("class", "center"); n.append("text").attr("class", "ct"); n.append("text").attr("class", "cl"); return n; });
  cg.select("text.ct").attr("data-lk", "center|total");
  cg.select("text.cl").attr("data-lk", "center|caption");
  cg.select("text.ct").attr("text-anchor", "middle").attr("x", 0).attr("y", -capTotal / 2 + N * 0.72).attr("font-size", N).attr("font-weight", 700).attr("fill", theme.ink)
    .transition(t).tween("text", function () { return ctx.numTween(this, total, ctx.fmt); });
  cg.select("text.cl").attr("text-anchor", "middle").attr("x", 0).attr("y", capTotal / 2).attr("font-size", L).attr("fill", theme.muted).text(s.centerLabel || "");
}

TEMPLATES.race = {
  name: "Bar chart race",
  blurb: "Animated ranking over time; one column per period",
  bindings: [
    { key: "label", label: "Names", type: "column", prefer: "text" },
    { key: "values", label: "Periods (one column each)", type: "columns", prefer: "number", min: 2 },
    { key: "color", label: "Colour by", type: "column", prefer: "text", optional: true, help: "A category column; without it up to 8 names get their own colour" },
  ],
  settings: [
    { section: "Race", items: [
      { key: "topN", label: "Bars shown", type: "range", min: 3, max: 20, step: 1, default: 10 },
      { key: "stepMs", label: "Time per period (ms)", type: "range", min: 300, max: 5000, step: 100, default: 1500 },
      { key: "autoplay", label: "Play automatically", type: "toggle", default: true },
      { key: "loop", label: "Loop", type: "toggle", default: false },
      { key: "showPeriod", label: "Big period label", type: "toggle", default: true },
      { key: "corners", label: "Bar ends", type: "select", default: "rounded", options: [["square", "Square"], ["rounded", "Rounded"], ["pill", "Pill"]] },
    ] },
    AXES([{ key: "valMax", label: "Value axis: maximum", type: "text", default: "", placeholder: "Follows the leader", help: "A fixed end keeps the scale still, so bars grow instead of the axis shrinking." },
      { key: "valStep", label: "Value axis: step between ticks", type: "text", default: "", placeholder: "Auto" }]),
  ],
  render: renderRace,
  legend: ctx => ctx.b.color == null ? [] : [...new Set(ctx.rows.map(r => str(r[ctx.b.color])).filter(Boolean))].map(n => ({ name: n, color: ctx.colorOf(n) })),
  controls: true,
};

function raceFrames(ctx) {
  const { rows, b, headers } = ctx;
  const periods = b.values.map(i => headers[i]);
  const names = uniqueNames(rows.map(r => str(r[b.label])));
  const series = rows.map((r, k) => {
    const v = b.values.map(i => parseNum(r[i]));
    // blanks: carry the last known value forward, zero before the first
    let last = 0; for (let i = 0; i < v.length; i++) { if (Number.isFinite(v[i])) last = v[i]; else v[i] = last; }
    return { name: names[k], group: b.color != null ? str(r[b.color]) : null, v };
  }).filter(d => d.name);
  const K = 10, frames = [];
  for (let p = 0; p < periods.length; p++) {
    const steps = p === periods.length - 1 ? 1 : K;
    for (let k = 0; k < steps; k++) {
      const f = k / K;
      frames.push({ period: p, f, label: periods[p], values: series.map(d => ({ name: d.name, group: d.group, value: p === periods.length - 1 ? d.v[p] : d.v[p] * (1 - f) + d.v[p + 1] * f })) });
    }
  }
  for (const fr of frames) {
    fr.values.sort((a, c) => c.value - a.value);
    fr.values.forEach((d, i) => { d.rank = i; });
  }
  return { frames, periods, series, K };
}

function renderRace(ctx) {
  const { s, svg, W, theme, font, fs, inst } = ctx;
  const R = inst.race || (inst.race = { frame: 0, playing: false, timer: null });
  const { frames, periods, series, K } = raceFrames(ctx);
  if (!frames.length || series.length === 0) return ctx.empty("Choose a name column and two or more period columns.");
  R.frames = frames; R.periods = periods; R.K = K;
  R.frame = Math.min(R.frame, frames.length - 1);
  const n = Math.min(+s.topN, series.length);
  const nameW = Math.min(d3.max(series, d => measure(d.name, fs, 500, font)) + 10, W * 0.32);
  const maxVal = d3.max(frames, fr => fr.values[0].value) || 1;
  const valueW = measure(ctx.fmt(maxVal), fs, 600, font) + 10;
  const m = { top: s.axisLabels ? fs + 10 : 4, right: valueW, bottom: 6, left: nameW };
  const barH = fs * 2.2;
  const H = ctx.fixedH || n * barH + m.top + m.bottom;
  ctx.size(H);
  const y = d3.scaleBand(d3.range(n + 1), [m.top, m.top + (H - m.top - m.bottom) * (n + 1) / n]).padding(0.18);
  const colorKey = d => d.group != null ? d.group : series.length <= ctx.pal.length ? d.name : "__single";
  const colorBy = d => ctx.override(d.name) || ctx.colorOf(colorKey(d));
  const rr = s.corners === "square" ? 0 : s.corners === "pill" ? 999 : 4;
  const muted = d => ctx.hl.size && !ctx.hl.has(d.name.toLowerCase()) && !(d.group && ctx.hl.has(d.group.toLowerCase()));

  function draw(fi, dur) {
    const fr = frames[fi];
    const t = svg.transition("race").duration(dur).ease(d3.easeLinear);
    const top = fr.values.slice(0, n);
    const fixMax = numOrNull(s.valMax), step = numOrNull(s.valStep);
    const x = d3.scaleLinear([0, fixMax > 0 ? fixMax : Math.max(top[0].value, 1e-9)], [m.left, W - m.right]).clamp(fixMax > 0);
    x._step = step > 0 ? step : null;
    // axis
    const ticks = ticksOf(x, Math.max(2, Math.floor(W / 120)));
    const af = ctx.fmt.axis(ticks);
    const ax = layer(svg, "axis"); ax.lower();
    const tk = ax.selectAll("g.tick").data(ticks, v => v).join(e => { const g = e.append("g").attr("class", "tick").attr("opacity", 0).attr("transform", v => `translate(${x(v)},0)`); g.append("line"); g.append("text"); return g; },
      u => u, x_ => x_.transition(t).attr("opacity", 0).attr("transform", v => `translate(${x(v)},0)`).remove());
    tk.transition(t).attr("opacity", 1).attr("transform", v => `translate(${x(v)},0)`);
    tk.select("line").attr("y1", m.top).attr("y2", H - m.bottom).attr("stroke", v => v === 0 ? theme.axis : theme.grid).attr("opacity", v => v === 0 || s.grid ? 1 : 0);
    tk.select("text").attr("y", m.top - 8).attr("text-anchor", "middle").attr("fill", theme.muted).attr("font-size", fs * 0.86).attr("opacity", s.axisLabels ? 1 : 0).text(af);
    const g = layer(svg, "marks");
    const bars = g.selectAll("g.bar").data(top, d => d.name).join(
      e => { const b = e.append("g").attr("class", "bar").attr("transform", `translate(0,${y(n)})`).attr("opacity", 0); b.append("path"); b.append("text").attr("class", "name"); b.append("text").attr("class", "val"); return b; },
      u => u,
      x_ => x_.transition(t).attr("transform", `translate(0,${y(n)})`).attr("opacity", 0).remove());
    bars.attr("data-ck", colorKey).attr("data-ck2", d => colorKey(d) === d.name ? null : d.name);
    bars.call(ctx.hover, d => ({ title: d.name, sub: fr.label, rows: [{ name: "Value", value: ctx.fmt(d.value) }, { name: "Rank", value: String(d.rank + 1) }], color: colorBy(d) }));
    bars.transition(t).attr("transform", d => `translate(0,${y(d.rank)})`).attr("opacity", 1);
    bars.select("path").attr("fill", d => muted(d) ? theme.other : colorBy(d)).transition(t).attr("d", d => rpath(x(0), 0, x(d.value) - x(0), y.bandwidth(), rr, "right"));
    bars.select("text.name").attr("x", m.left - 8).attr("y", y.bandwidth() / 2).attr("dy", "0.35em").attr("text-anchor", "end")
      .attr("fill", d => muted(d) ? theme.muted : theme.ink).attr("font-weight", 500).text(d => fit(d.name, m.left - 12, fs, 500, font));
    bars.select("text.val").attr("y", y.bandwidth() / 2).attr("dy", "0.35em").attr("fill", theme.ink2).attr("font-weight", 600)
      .transition(t).attr("x", d => x(d.value) + 6).tween("text", function (d) { return ctx.numTween(this, d.value, ctx.fmt); });
    layer(svg, "period", "text").lower().attr("text-anchor", "end").attr("x", W - m.right - 6).attr("y", H - m.bottom - fs)
      .attr("font-size", Math.min(W / 8, 110)).attr("font-weight", 800).attr("fill", theme.grid).attr("opacity", s.showPeriod ? 1 : 0)
      .text(fr.label);
    if (inst.onRaceFrame) inst.onRaceFrame(fi);
  }
  R.draw = draw;
  const later = (fn, ms) => { const id = setTimeout(fn, ms); return { stop: () => clearTimeout(id) }; };
  R.stop = () => { R.playing = false; if (R.timer) R.timer.stop(); R.timer = null; inst.onRacePlay && inst.onRacePlay(false); };
  R.play = () => {
    if (R.frame >= frames.length - 1) R.frame = 0;
    R.playing = true; inst.onRacePlay && inst.onRacePlay(true);
    const tick = () => {
      if (!R.playing) return;
      if (R.frame >= R.frames.length - 1) {
        if (s.loop) { R.timer = later(() => { R.frame = 0; draw(0, 0); tick(); }, 1500); return; }
        return R.stop();
      }
      R.frame++;
      const dur = s.stepMs / R.K;
      draw(R.frame, dur);
      R.timer = later(tick, dur);
    };
    if (R.timer) R.timer.stop();
    tick();
  };
  R.seek = fi => { R.stop(); R.frame = fi; draw(fi, 0); };
  draw(R.frame, ctx.first ? 0 : Math.min(ctx.dur, 300));
  if (ctx.first && s.autoplay && !R.playing && !ctx.opts.static) R.timer = later(() => R.play(), 600);
}

TEMPLATES.sankey = {
  name: "Sankey",
  blurb: "Flows between stages; one column per stage plus a value",
  bindings: [
    { key: "steps", label: "Stages (in order)", type: "columns", prefer: "text", min: 2 },
    { key: "value", label: "Value", type: "column", prefer: "number" },
  ],
  settings: [
    { section: "Nodes & labels", items: [
      { key: "nodeWidth", label: "Node width", type: "range", min: 4, max: 30, step: 1, default: 12 },
      { key: "nodePadding", label: "Space between nodes", type: "range", min: 2, max: 40, step: 1, default: 10, help: "Nodes also move apart as far as their labels need." },
      { key: "nodeAlign", label: "Node alignment", type: "select", default: "justify", options: [["justify", "Ends in the last column"], ["left", "Left"], ["right", "Right"], ["center", "Centre"]] },
      { key: "nodeColors", label: "Node colours", type: "select", default: "ends", options: [["ends", "First and last columns; middle neutral"], ["all", "Every node"]] },
      { key: "nodeShape", label: "Node corners", type: "select", default: "rounded", options: [["rounded", "Slightly rounded"], ["square", "Square"], ["pill", "Round"]] },
      { key: "nodeValues", label: "Values under names", type: "toggle", default: true },
      { key: "nodeShare", label: "Share of column (%)", type: "toggle", default: true },
      { key: "headings", label: "Column and group headings with totals", type: "toggle", default: true },
      { key: "groupSep", label: "Sub-groups in cells", type: "select", default: ":", options: [[":", "Group: Name"], ["|", "Group | Name"], ["none", "Off"]],
        help: "Write “Exported: Diesel” in a cell to list Diesel under an EXPORTED heading. The same name can then sit in two groups of one column." },
      { key: "stageTitles", label: "Heading text", type: "text", default: "", placeholder: "Column names; separate with |", show: s => s.headings },
      { key: "hatch", label: "Hatched nodes", type: "textarea", default: "", placeholder: "One name per line\nLosses", help: "For losses and other balancing items. Commas also separate names, unless the whole line is a node name." },
    ] },
    { section: "Flows", items: [
      { key: "linkColor", label: "Flow colour", type: "select", default: "auto", options: [["auto", "From the outer node"], ["source", "From the source node"], ["target", "From the target node"], ["grey", "Grey"]] },
      { key: "linkOpacity", label: "Flow opacity", type: "range", min: 0.1, max: 0.9, step: 0.05, default: 0.5 },
      { key: "seams", label: "Thin seams between flows", type: "toggle", default: true },
      { key: "curviness", label: "Flow curve", type: "range", min: 0, max: 1, step: 0.1, default: 1 },
      { key: "taper", label: "Flow taper", type: "range", min: 0, max: 0.3, step: 0.02, default: 0 },
      { key: "flowValues", label: "Values on flows", type: "select", default: "auto", options: [["auto", "Where the nodes don't already show them"], ["all", "Every flow"], ["none", "None (popups only)"]],
        help: "Automatic skips a label that would overlap other text; its value stays in the popup." },
    ] },
  ],
  render: renderSankey,
  legend: () => [],
};

function flowPoint(l, t, curv) {
  const x0 = l.source.x1, x1 = l.target.x0, e = t + curv * (t * t * (3 - 2 * t) - t);
  return { x: x0 + (x1 - x0) * t, y: l.y0 + (l.y1 - l.y0) * e };
}
// a filled band between two node edges; a fixed number of points keeps transitions smooth. Flows start and end
// 1px under the nodes so they join without a hairline, and the thinnest stay visible.
function flowPath(l, taper, curv) {
  const x0 = l.source.x1 - 1, x1 = l.target.x0 + 1, h = Math.max(0.9, l.width / 2), ys = l.y0, yt = l.y1, N = 32;
  const top = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, e = t + curv * (t * t * (3 - 2 * t) - t);
    const x = x0 + (x1 - x0) * t, y = ys + (yt - ys) * e, w = h * (1 - taper * Math.sin(Math.PI * t));
    top.push(`${x.toFixed(2)},${(y - w).toFixed(2)}`); bot.push(`${x.toFixed(2)},${(y + w).toFixed(2)}`);
  }
  return `M${top.join("L")}L${bot.reverse().join("L")}Z`;
}
function wrapText(text, maxW, size, weight, family, maxLines) {
  const lines = [];
  let cur = "";
  for (const w of text.split(/\s+/)) {
    const tryLine = cur ? cur + " " + w : w;
    if (!cur || measure(tryLine, size, weight, family) <= maxW) cur = tryLine; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { const rest = lines.slice(maxLines - 1).join(" "); lines.length = maxLines - 1; lines.push(rest); }
  return lines.map(l => fit(l, maxW, size, weight, family));
}

function renderSankey(ctx) {
  const { s, svg, W, t, theme, fs, font, rows, b, headers } = ctx;
  if (!d3.sankey) return ctx.empty("The sankey layout (d3-sankey) did not load.");
  const linkMap = new Map(), nodeMap = new Map();
  const steps = b.steps;
  const sep = s.groupSep === "none" ? null : s.groupSep || ":";
  const splitCell = v => {
    const i = sep ? v.indexOf(sep) : -1;
    return i > 0 && i < v.length - 1 ? [v.slice(0, i).trim(), v.slice(i + 1).trim()] : ["", v];
  };
  const nodeFor = (k, cell) => {
    const [group, name] = splitCell(cell), id = `${k}\u0001${group}\u0001${name}`;
    if (!nodeMap.has(id)) nodeMap.set(id, { id, name, group, step: k, order: nodeMap.size });
    return id;
  };
  for (const r of rows) {
    const v = parseNum(r[b.value]);
    if (!(v > 0)) continue;
    // a blank middle stage lets a flow skip straight to the next named stage
    const named = steps.map((c, k) => [k, str(r[c])]).filter(([, n]) => n);
    for (let i = 0; i < named.length - 1; i++) {
      const ia = nodeFor(...named[i]), iz = nodeFor(...named[i + 1]);
      const key = ia + "\u0002" + iz;
      linkMap.set(key, (linkMap.get(key) || 0) + v);
    }
  }
  if (!linkMap.size) return ctx.empty("Choose two or more stage columns and a value column.");
  const groupRank = new Map();
  for (const d of nodeMap.values()) { const g = d.step + "\u0001" + d.group; if (!groupRank.has(g)) groupRank.set(g, groupRank.size); }
  const gkey = d => d.step + "\u0001" + d.group;
  const nodes = [...nodeMap.values()].map(d => ({ ...d })).sort((a, c) => groupRank.get(gkey(a)) - groupRank.get(gkey(c)) || a.order - c.order);
  const links = [...linkMap].map(([k, value]) => { const [source, target] = k.split("\u0002"); return { source, target, value, key: k }; });
  const firstStep = 0, lastStep = d3.max(nodes, d => d.step);

  // node totals before layout, so labels (and the margins they need) are known up front
  const inSum = new Map(), outSum = new Map();
  for (const l of links) { outSum.set(l.source, (outSum.get(l.source) || 0) + l.value); inSum.set(l.target, (inSum.get(l.target) || 0) + l.value); }
  nodes.forEach(d => { d.total = Math.max(inSum.get(d.id) || 0, outSum.get(d.id) || 0); });
  const colTotal = d3.rollup(nodes, v => d3.sum(v, d => d.total), d => d.step);
  const colCount = d3.rollup(nodes, v => v.length, d => d.step);
  const grpTotal = d3.rollup(nodes, v => d3.sum(v, d => d.total), gkey), grpCount = d3.rollup(nodes, v => v.length, gkey);
  const grouped = new Set(nodes.filter(d => d.group).map(d => d.step));
  const pct = x => d3.format(x < 0.1 ? ".1%" : ".0%")(x);
  // share of the node's group when it has company there, otherwise of its column
  const share = d => d.group && grpCount.get(gkey(d)) > 1 ? [d.total / grpTotal.get(gkey(d)), "Share of " + d.group]
    : colCount.get(d.step) > 1 && colTotal.get(d.step) > 0 ? [d.total / colTotal.get(d.step), "Share of column"] : null;
  const valueText = d => ctx.fmt(d.total) + (s.nodeShare && share(d) ? " · " + pct(share(d)[0]) : "");

  // labels: first column to the left of its nodes, last column to the right, middle columns to the left of
  // the node over the incoming flows. Outer labels get their own margins so they never sit on a flow.
  const nfs = fs * 0.92, vfs = fs * 0.84, lh = nfs * 1.22, vlh = vfs * 1.3;
  const sideMax = W * (W < 560 ? 0.3 : 0.26);
  const side = d => d.step === lastStep ? "right" : "left";
  const midMax = Math.max(80, (W - 2 * sideMax) / Math.max(1, lastStep) * 0.75);
  nodes.forEach(d => {
    const maxW = (d.step === firstStep || d.step === lastStep ? sideMax : midMax) - 10;
    d.lines = wrapText(d.name, maxW, nfs, 600, font, 3);
    d.vtext = s.nodeValues ? valueText(d) : "";
    // names wrap to the column width; the short value line is never cut, so it can be a little wider
    d.labW = Math.max(d3.max(d.lines, l => measure(l, nfs, 600, font)), d.vtext ? measure(d.vtext, vfs, 400, font) : 0);
    d.labH = d.lines.length * lh + (d.vtext ? vlh : 0);
  });
  const leftM = Math.min(sideMax + 20, d3.max(nodes.filter(d => d.step === firstStep), d => d.labW) + 10);
  const rightM = Math.min(sideMax + 20, d3.max(nodes.filter(d => d.step === lastStep), d => d.labW) + 10);
  const top = s.headings ? fs * 2.1 : 6;
  const pad = +s.nodePadding;
  const groupGap = s.headings ? fs * 2.4 : fs * 0.9;
  const needH = d3.max(d3.rollup(nodes, v => d3.sum(v, d => d.labH + 6) + (new Set(v.map(gkey)).size - 1) * groupGap, d => d.step).values());
  const Hguess = ctx.fixedH || Math.max(300, Math.min(1400, needH + top + 20));
  const align = { justify: d3.sankeyJustify, left: d3.sankeyLeft, right: d3.sankeyRight, center: d3.sankeyCenter }[s.nodeAlign] || d3.sankeyJustify;
  const sk = d3.sankey().nodeId(d => d.id).nodeWidth(+s.nodeWidth).nodePadding(pad).nodeAlign(align).nodeSort(null)
    .extent([[leftM, top], [W - rightM, Hguess - 6]]);
  let graph;
  try { graph = sk({ nodes, links }); }
  catch (e) { return ctx.empty("These flows loop back on themselves, which a sankey cannot draw."); }
  // move nodes apart where their labels need more room than the node padding gives, then re-route the flows
  for (const [, col] of d3.groups(graph.nodes, d => d.x0)) {
    const items = col.map(d => ({ d, y: (d.y0 + d.y1) / 2, h: d.y1 - d.y0, lab: d.labH }));
    spread(items, (a, c) => Math.max((a.h + c.h) / 2 + pad, (a.lab + c.lab) / 2 + 8) + (gkey(a.d) !== gkey(c.d) ? groupGap : 0), it => top + Math.max(it.h, it.lab) / 2, Infinity);
    items.forEach(it => { it.d.y0 = it.y - it.h / 2; it.d.y1 = it.y + it.h / 2; });
  }
  sk.update(graph);
  const bottom = d3.max(graph.nodes, d => Math.max(d.y1, (d.y0 + d.y1) / 2 + d.labH / 2));
  const H = ctx.fixedH || Math.max(Hguess, bottom + 8);
  ctx.size(H);

  // colours: middle columns are neutral hubs by default, so the palette goes to the categories at either end
  const ends = s.nodeColors !== "all";
  const isMid = d => d.step !== firstStep && d.step !== lastStep;
  [...graph.nodes].sort((a, c) => a.step - c.step || a.y0 - c.y0).forEach(d => { if (!(ends && isMid(d))) ctx.colorOf(d.name); });
  const nodeColor = d => ctx.override(d.name) || (ends && isMid(d) ? theme.ink : ctx.colorOf(d.name));
  // one name per line; a line that isn't itself a node name is also split on commas
  const allNames = new Set(graph.nodes.map(d => d.name.toLowerCase()));
  const hatchSet = new Set(String(s.hatch || "").split(/[\n;]/).map(x => x.trim().toLowerCase()).filter(Boolean)
    .flatMap(line => allNames.has(line) ? [line] : line.split(",").map(x => x.trim()).filter(Boolean)));
  const hatched = d => hatchSet.has(d.name.toLowerCase());
  const pid = "hatch-" + (ctx.inst.hid || (ctx.inst.hid = Math.random().toString(36).slice(2, 8)));
  if (hatchSet.size) {
    const defs = layer(svg, "fl-defs", "defs");
    const pat = defs.selectAll(`pattern#${pid}`).data([0]).join(e => { const p = e.append("pattern").attr("id", pid); p.append("rect"); p.append("line"); return p; })
      .attr("patternUnits", "userSpaceOnUse").attr("width", 7).attr("height", 7).attr("patternTransform", "rotate(45)");
    pat.select("rect").attr("width", 7).attr("height", 7).attr("fill", theme.grid);
    pat.select("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 7).attr("stroke", theme.muted).attr("stroke-width", 2.2);
  }
  const muted = d => ctx.hl.size && !ctx.hl.has(d.name.toLowerCase());
  const linkMuted = l => ctx.hl.size && !ctx.hl.has(l.source.name.toLowerCase()) && !ctx.hl.has(l.target.name.toLowerCase());
  const colourNode = l => s.linkColor === "source" ? l.source : s.linkColor === "target" ? l.target
    : l.source.step === firstStep ? l.source : l.target.step === lastStep ? l.target : l.source;
  const taper = +s.taper || 0, curv = s.curviness == null ? 1 : +s.curviness;

  const lp = layer(svg, "links").selectAll("path").data(graph.links, l => l.key)
    .join(e => e.append("path").attr("fill-opacity", 0), u => u, x_ => x_.transition(t).attr("fill-opacity", 0).remove());
  lp.attr("data-ck", l => colourNode(l).name).attr("stroke", s.seams ? theme.surface : "none").attr("stroke-width", 0.8).attr("stroke-linejoin", "round")
    .call(ctx.hover, l => ({ title: `${l.source.name} → ${l.target.name}`, rows: [{ name: "Value", value: ctx.fmt(l.value) }, { name: `Share of ${l.source.name}`, value: pct(l.value / l.source.value) }, { name: `Share of ${l.target.name}`, value: pct(l.value / l.target.value) }] }))
    .transition(t).attr("d", l => flowPath(l, taper, curv))
    .attr("fill", l => hatched(l.source) || hatched(l.target) ? `url(#${pid})` : linkMuted(l) ? theme.other : s.linkColor === "grey" ? theme.muted : nodeColor(colourNode(l)))
    .attr("fill-opacity", l => hatched(l.source) || hatched(l.target) ? 0.9 : linkMuted(l) ? s.linkOpacity * 0.4 : +s.linkOpacity);
  const nr = d => s.nodeShape === "square" ? 0 : s.nodeShape === "pill" ? Math.min(+s.nodeWidth / 2, (d.y1 - d.y0) / 2) : Math.min(2, +s.nodeWidth / 4, (d.y1 - d.y0) / 2);
  layer(svg, "nodes").selectAll("rect.node").data(graph.nodes, d => d.id)
    .join(e => e.append("rect").attr("class", "node").attr("opacity", 0), u => u, x_ => x_.transition(t).attr("opacity", 0).remove())
    .attr("data-ck", d => d.name)
    .call(ctx.hover, d => ({ title: d.name, sub: d.group || null, rows: [{ name: "Value", value: ctx.fmt(d.total) }, ...(share(d) ? [{ name: share(d)[1], value: pct(share(d)[0]) }] : [])], color: nodeColor(d) }))
    .transition(t).attr("opacity", 1).attr("x", d => d.x0).attr("y", d => d.y0).attr("width", d => d.x1 - d.x0).attr("height", d => Math.max(1.5, d.y1 - d.y0))
    .attr("rx", nr).attr("fill", d => hatched(d) ? `url(#${pid})` : muted(d) ? theme.other : nodeColor(d));

  // column headings with totals
  const plainFmt = makeFormat({ ...s, prefix: "", suffix: "" }, [...colTotal.values()]);
  const titles = String(s.stageTitles || "").split("|").map(x => x.trim());
  const headFor = (step, members, text, key) => {
    const x0 = d3.min(members, d => d.x0), x1 = d3.max(members, d => d.x1);
    const blockTop = d3.min(members, d => Math.min(d.y0, (d.y0 + d.y1) / 2 - d.labH / 2));
    return { key, text, x: step === firstStep ? x1 : step === lastStep ? x0 : (x0 + x1) / 2,
      anchor: step === firstStep ? "end" : step === lastStep ? "start" : "middle", y: blockTop - 9 };
  };
  const heads = !s.headings ? [] : d3.groups(graph.nodes, d => d.step).flatMap(([step, col]) => {
    if (!grouped.has(step)) return [headFor(step, col, `${(titles[step] || headers[steps[step]] || "").toUpperCase()} · ${plainFmt(colTotal.get(step))}`, `c${step}`)];
    return d3.groups(col, d => d.group).filter(([g]) => g).map(([g, members]) =>
      headFor(step, members, g.toUpperCase() + (members.length > 1 ? ` · ${plainFmt(d3.sum(members, d => d.total))}` : ""), `g${step}\u0001${g}`));
  });

    .attr("x", l => l.x).attr("y", l => l.y + tfs * 0.36 - (l.lines.length - 1) * tfs * 0.56)
    .attr("fill", l => contrastInk(fillOf(l.st)))

    if (legend.kind === "steps") {

      d3.range(0, 1.0001, 0.1).forEach(x => grad.append("stop").attr("offset", x).attr("stop-color", legend.ramp(x)));

      ticks.forEach((v, i) => lgd.append("text").attr("x", (v - legend.lo) / (legend.hi - legend.lo) * bw).attr("y", y + 10 + lfs * 1.15)
        .attr("text-anchor", i === 0 ? "start" : i === ticks.length - 1 ? "end" : "middle").attr("font-size", lfs * 0.92).attr("fill", theme.ink2).text(fmt(v)));

    }

      lgd.append("rect").attr("y", y).attr("width", 14).attr("height", 14).attr("rx", 3).attr("fill", noFill).attr("stroke", theme.grid);
      lgd.append("text").attr("x", 22).attr("y", y + 11).attr("font-size", lfs).attr("fill", theme.muted).text(s.noData);
    }
  }
  layer(svg, "maplabels").raise();
  layer(svg, "mapcallouts").raise();
